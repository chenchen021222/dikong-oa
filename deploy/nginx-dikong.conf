server {
    listen 80;
    server_name 192.168.101.172;
    root /opt/dikong-oa/dist;
    index index.html;

    client_max_body_size 20m;

    location /local-db/ {
        proxy_pass http://127.0.0.1:8618;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location /score-api/ {
        proxy_pass http://192.168.101.127:15050/;
        proxy_http_version 1.1;
        proxy_set_header Host 192.168.101.127:15050;
        proxy_read_timeout 30s;
    }

    location /images/ {
        proxy_pass http://127.0.0.1:9000/dikong-images/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:9000;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
